<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vapor — Shelf page (reference mockup)</title>
<!-- REFERENCE MOCKUP (S1). Opened from "See all (n) →" on a library shelf. Interactive: remove/add rule conditions; grid and "Almost in" update live. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shelves-common.css">
<style>
  .banner{position:relative;height:380px;overflow:hidden}
  .banner__strip{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .banner__strip img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
  .banner__dim{position:absolute;inset:0;background:rgba(11,11,15,.45)}
  .banner__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.6) 0%,rgba(11,11,15,0) 30%,rgba(11,11,15,.75) 70%,var(--bg) 100%)}
  .banner .topbar{position:relative}
  .banner .back,.banner .profile{background:rgba(0,0,0,.45)}
  .banner__bottom{position:absolute;left:var(--page-x);right:var(--page-x);bottom:32px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
  h1{margin:0;font-size:56px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .rulebar{margin:8px var(--page-x) 0;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .grid-6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px 20px;padding:24px var(--page-x) 0}
  .almost{padding:44px var(--page-x) 48px;display:flex;flex-direction:column;gap:14px}
  .grid-8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:16px}
  .grid-8 .cover{opacity:.85}
  .grid-8 img{filter:saturate(.6);border-radius:12px}
  .grid-8 .missing{font-size:11px;color:var(--accent)}
</style>
</head>
<body>
<header class="banner">
  <div class="banner__strip" id="strip"></div>
  <div class="banner__dim"></div><div class="banner__scrim"></div>
  <div class="topbar">
    <a class="back" href="library.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Library</a>
    <a class="profile" href="#">Flitcher<span class="avatar"></span></a>
  </div>
  <div class="banner__bottom">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="kicker"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>SMART SHELF</span>
      <h1 id="title">Demanding indies</h1>
      <span style="color:#E6E6EA"><span id="count"></span> games · updates itself</span>
    </div>
    <span style="margin-left:auto;display:flex;gap:10px">
      <button class="btn btn--ghost" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 17v5M5 10l7-7 7 7-4 1-3 6-3-6z"/></svg>Pinned</button>
      <button class="btn btn--primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="#0B0B0F" aria-hidden="true"><path d="M7 4l12 8-12 8z"/></svg>Play a random one</button>
    </span>
  </div>
</header>

<section class="panel rulebar" aria-label="Rule">
  <div class="row"><span class="eyebrow" style="margin-right:6px">Rule</span><span id="conds" class="row"></span>
    <button class="btn btn--quiet" style="margin-left:auto;height:32px;font-size:12px">Sort: Last played ▾</button></div>
  <div class="row"><span class="muted" style="font-size:12px;margin-right:4px">+ Add:</span><span id="options" class="row"></span></div>
</section>

<div class="empty hidden" id="empty" style="margin:24px var(--page-x) 0">No game matches the whole rule.</div>
<section class="grid-6" id="grid" aria-label="Games in this shelf"></section>

<section class="almost" id="almost-wrap">
  <div style="display:flex;align-items:baseline;gap:12px"><h2 style="margin:0;font-size:20px;font-weight:700">Almost in</h2><span class="muted" style="font-size:13px">One criterion missing — add the tag to include them</span></div>
  <div class="grid-8" id="almost"></div>
</section>

<script src="shelves-common.js"></script>
<script>
const shelf = structuredClone(SHELVES.find(s => s.id === "hard-indies"));
const POOL = { tags: FIELDS.tags.values, modes: FIELDS.modes.values };
function render() {
  const rule = shelf.rule;
  const list = GAMES.filter(g => matches(g, rule));
  document.getElementById("strip").innerHTML = (list.length ? list : GAMES).slice(0, 4).map(g => `<img src="${hero(g.appId)}" alt="">`).join("");
  document.getElementById("count").textContent = list.length;
  document.getElementById("conds").innerHTML = rule.conditions.map((c, i) =>
    (i ? `<span class="joiner">AND</span>` : "") +
    `<button class="cond" data-remove="${i}" aria-label="Remove ${esc(c.values.join(" or "))}"><span class="muted">${FIELDS[c.field].label}</span>${esc(c.values.join(" or "))}<span class="cond__x">×</span></button>`).join("");
  const used = new Set(rule.conditions.flatMap(c => c.values));
  document.getElementById("options").innerHTML = Object.entries(POOL).flatMap(([f, vals]) =>
    vals.filter(v => !used.has(v)).map(v => `<button class="chip chip--dashed" data-add="${f}|${esc(v)}">${esc(v)}</button>`)).join("");
  document.getElementById("grid").innerHTML = list.map(g => `<a class="cover" href="game.html"><img src="${cover(g.appId)}" alt=""><span><span class="cover__t" style="display:block;font-size:14px">${esc(g.name)}</span><span class="cover__s">${esc(g.meta || g.genre)}</span></span></a>`).join("");
  document.getElementById("empty").classList.toggle("hidden", list.length > 0);
  const alm = almost(rule);
  document.getElementById("almost-wrap").classList.toggle("hidden", !alm.length);
  document.getElementById("almost").innerHTML = alm.slice(0, 8).map(g => `<a class="cover" href="game.html"><img src="${cover(g.appId)}" alt=""><span class="cover__t" style="font-size:12px">${esc(g.name)}</span><span class="missing">missing: ${esc(g.missing)}</span></a>`).join("");
}
document.addEventListener("click", e => {
  const r = e.target.closest("[data-remove]");
  if (r) { shelf.rule.conditions.splice(+r.dataset.remove, 1); render(); return; }
  const a = e.target.closest("[data-add]");
  if (a) { const [field, v] = a.dataset.add.split("|"); shelf.rule.conditions.push({ field, values: [v] }); render(); }
});
render();
</script>
</body>
</html>
