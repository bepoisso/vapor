[package]
name = "vapor"
version = "0.1.0"
description = "A fast, open-source desktop client for your Steam library."
authors = ["Benjamin Poisson <bepoisso>"]
license = "MIT"
repository = "https://github.com/bepoisso/vapor"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "vapor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Typed Rust -> TypeScript bindings. Still release candidates: pin exact versions.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
keyvalues-parser = "0.2"
notify = "8"
notify-debouncer-mini = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fast_image_resize = { version = "6", features = ["image"] }
dirs = "6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56"
